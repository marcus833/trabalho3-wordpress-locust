
services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wp123
    volumes:
      - mysql_data:/var/lib/mysql

  wordpress1: &wordpress
    image: wordpress:5.4.2-php7.2-apache
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wp123
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./wordpress-data:/var/www/html
    depends_on:
      - mysql

  wordpress2:
    <<: *wordpress

  wordpress3:
    <<: *wordpress

  # wordpress4 e wordpress5 sao usados apenas nos testes de carga do
  # Trabalho 3, para explorar niveis de escalabilidade alem dos 3
  # exigidos no Trabalho 2. O Nginx so os utiliza quando a configuracao
  # nginx-4-instancias.conf ou nginx-5-instancias.conf esta ativa.
  wordpress4:
    <<: *wordpress

  wordpress5:
    <<: *wordpress

  nginx:
    image: nginx:1.19.0
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./wordpress-data:/usr/share/nginx/html:ro
    depends_on:
      - wordpress1
      - wordpress2
      - wordpress3
      - wordpress4
      - wordpress5

  locust:
    image: grubykarol/locust
    ports:
      - "8089:8089"
    volumes:
      - ./locust/locustfiles:/locust
      - ./resultados:/resultados
    environment:
      ATTACKED_HOST: http://nginx
      LOCUST_FILE: cenario1_imagem_1mb.py
    depends_on:
      - nginx

volumes:
  mysql_data:

networks:
  default:
    name: wordpress_net